name: Build and Push to ACR

on:
  push:
    branches:
      - feat/luojian-Advanced-search

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  ACR_REPO_PREFIX: ${{ vars.ACR_REPO_PREFIX }}

jobs:
  build_setup:
    name: Build Setup
    runs-on: ubuntu-22.04
    outputs:
      image_tag: ${{ steps.vars.outputs.IMAGE_TAG }}
    steps:
      - id: vars
        name: Compute Image Tag
        run: |
          FLAT_BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g')
          echo "IMAGE_TAG=${FLAT_BRANCH_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build-Push ${{ matrix.service }} Image
    runs-on: ubuntu-22.04
    needs: [build_setup]
    strategy:
      matrix:
        include:
          - service: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - service: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - service: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - service: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - service: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - service: proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_REPO_PREFIX }}/${{ matrix.service }}:${{ needs.build_setup.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_REPO_PREFIX }}/${{ matrix.service }}:latest
